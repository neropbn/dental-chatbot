<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dental Practice Chatbot</title>
    <style>
        :root {
            --log-panel-width: 400px;
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-green: #00d8ff;
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .container {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        .chat-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            position: relative;
        }
        
        .resizer {
            width: 3px;
            background: var(--border-color);
            cursor: col-resize;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 10;
            transition: background 0.2s;
        }
        
        .resizer:hover, .resizer.active {
            background: var(--accent-green);
        }
        
        .chat-header {
            padding: 16px 20px;
            background: var(--bg-primary);
            color: var(--accent-green);
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            font-size: 1.1em;
            font-weight: 500;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }
        
        .chat-header::before {
            content: "user@dental-bot:~$ ";
            color: var(--text-secondary);
            margin-right: 8px;
        }
        
        .chat-header::after {
            content: "_";
            animation: blink 1s infinite;
            color: var(--accent-green);
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-secondary);
        }
        
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.5;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            word-break: break-word;
        }
        
        .message.user {
            align-self: flex-end;
            background: var(--bg-tertiary);
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
        }
        
        .message.bot {
            align-self: flex-start;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .chat-input {
            display: flex;
            padding: 16px;
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color);
        }
        
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95em;
            outline: none;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
        }
        
        .chat-input input:focus {
            border-color: var(--accent-green);
        }
        
        .chat-input button {
            margin-left: 12px;
            padding: 12px 20px;
            background: var(--accent-green);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            font-weight: 500;
        }
        
        .chat-input button:hover {
            background: var(--accent-blue);
        }
        
        .log-panel {
            width: var(--log-panel-width);
            min-width: 220px;
            max-width: calc(100vw - 300px);
            background: var(--bg-primary);
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            border-left: 1px solid var(--border-color);
        }
        
        .log-header {
            padding: 16px 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 1em;
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .log-header .token-total {
            font-size: 0.9em;
            color: var(--accent-green);
            font-weight: normal;
        }
        
        .token-usage {
            font-size: 0.8em;
            color: var(--accent-blue);
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }
        
        .log-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            font-size: 0.9em;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .log-entry {
            background: var(--bg-secondary);
            border-radius: 6px;
            padding: 10px 12px;
            color: var(--text-secondary);
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            font-size: 0.85em;
            word-break: break-word;
            white-space: pre-wrap;
            border: 1px solid var(--border-color);
        }
        
        .request-details {
            background: var(--bg-primary);
            border-left: 3px solid var(--accent-green);
            padding: 12px;
            margin-top: 8px;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            font-size: 0.8em;
            white-space: pre-wrap;
            border-radius: 4px;
            color: var(--text-secondary);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            border: 1px solid var(--border-color);
        }
        
        .request-details.visible {
            display: block;
        }
        
        .request-details-toggle {
            color: var(--accent-green);
            cursor: pointer;
            font-size: 0.75em;
            margin-top: 8px;
            font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            transition: all 0.2s;
            border: 1px solid var(--border-color);
        }
        
        .request-details-toggle:hover {
            background: var(--bg-primary);
            color: var(--accent-blue);
        }
        
        .request-details-toggle::before {
            content: "▶ ";
            transition: transform 0.2s;
            display: inline-block;
        }
        
        .request-details-toggle.expanded::before {
            content: "▼ ";
        }
        
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .log-panel {
                width: 100vw;
                min-width: 0;
                max-width: 100vw;
                min-height: 180px;
                max-height: 220px;
                flex: none;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-panel">
            <div class="chat-header">dental-chatbot</div>
            <div class="chat-messages" id="chat-messages"></div>
            <form class="chat-input" id="chat-form">
                <input type="text" id="user-input" placeholder="Enter your question..." autocomplete="off" required />
                <button type="submit">Send</button>
            </form>
            <div class="resizer" id="resizer"></div>
        </div>
        <div class="log-panel">
            <div class="log-header">
                <span>System Log</span>
                <span class="token-total">Total Tokens: <span id="total-tokens">0</span></span>
            </div>
            <div class="log-messages" id="log-messages"></div>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const logMessages = document.getElementById('log-messages');
        const totalTokensElement = document.getElementById('total-tokens');
        let totalTokens = 0;
        let currentSessionId = null;

        function addMessageToChat(role, content, requestDetails = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role === 'user' ? 'user' : 'bot'}`;
            
            // Add the message content
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);
            
            // If this is an assistant message and we have request details, add them with toggle
            if (role === 'assistant' && requestDetails) {
                // Add toggle button
                const toggleButton = document.createElement('div');
                toggleButton.className = 'request-details-toggle';
                toggleButton.textContent = 'Show Context & LLM Request';
                toggleButton.onclick = function() {
                    const detailsDiv = this.nextElementSibling;
                    detailsDiv.classList.toggle('visible');
                    this.classList.toggle('expanded');
                    this.textContent = this.classList.contains('expanded') ? 
                        'Hide Context & LLM Request' : 'Show Context & LLM Request';
                };
                messageDiv.appendChild(toggleButton);
                
                // Add request details div (hidden by default)
                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'request-details';
                
                // Format the request details more concisely
                let detailsText = '📋 Context Retrieved from Vector DB:\n';
                detailsText += requestDetails.context + '\n\n';
                
                detailsText += '💬 Full Conversation Sent to LLM:\n';
                requestDetails.messages.forEach((msg, index) => {
                    const roleLabel = msg.role === 'system' ? '🤖 System' : 
                                     msg.role === 'user' ? '👤 User' : '🏥 Assistant';
                    detailsText += `${roleLabel}: ${msg.content}\n\n`;
                });
                
                detailsDiv.textContent = detailsText;
                messageDiv.appendChild(detailsDiv);
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addLogEntry(text, tokenInfo = null) {
            const log = document.createElement('div');
            log.className = 'log-entry';
            
            if (tokenInfo) {
                // Add the main log text
                const logText = document.createElement('div');
                logText.textContent = text;
                log.appendChild(logText);
                
                // Add compact token usage
                const tokenUsage = document.createElement('div');
                tokenUsage.className = 'token-usage';
                tokenUsage.textContent = `[P: ${tokenInfo.prompt_tokens} | C: ${tokenInfo.completion_tokens}]`;
                log.appendChild(tokenUsage);
                
                // Update total tokens
                totalTokens += tokenInfo.total_tokens;
                totalTokensElement.textContent = totalTokens;
            } else {
                log.textContent = text;
            }
            
            logMessages.appendChild(log);
            logMessages.scrollTop = logMessages.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Add user message to chat
            addMessageToChat('user', message);
            userInput.value = '';

            // Add log entry for sending request
            addLogEntry('Sending request to AI...');

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: currentSessionId
                    })
                });

                const data = await response.json();
                
                if (response.ok) {
                    // Store session ID if this is a new session
                    if (data.session_id) {
                        currentSessionId = data.session_id;
                        addLogEntry('New chat session started');
                    }

                    // Add assistant's response with request details
                    addMessageToChat('assistant', data.response, data.request_details);
                    
                    // Add token usage to log
                    addLogEntry('Response received', data.token_usage);
                } else {
                    addMessageToChat('system', `Error: ${data.detail}`);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessageToChat('system', 'Error: Failed to get response from server');
            }
        }

        // Handle form submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await sendMessage();
        });

        // Add enter key support
        userInput.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                await sendMessage();
            }
        });

        // Add resizer functionality
        const resizer = document.getElementById('resizer');
        const logPanel = document.querySelector('.log-panel');
        let isResizing = false;
        let lastDownX = 0;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            lastDownX = e.clientX;
            resizer.classList.add('active');
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            
            const deltaX = lastDownX - e.clientX;
            const newWidth = parseInt(getComputedStyle(logPanel).width) + deltaX;
            
            if (newWidth >= 220 && newWidth <= window.innerWidth - 300) {
                logPanel.style.width = newWidth + 'px';
                document.documentElement.style.setProperty('--log-panel-width', newWidth + 'px');
            }
            
            lastDownX = e.clientX;
        });

        document.addEventListener('mouseup', () => {
            if (!isResizing) return;
            isResizing = false;
            resizer.classList.remove('active');
            document.body.style.cursor = '';
        });

        // Prevent text selection while resizing
        resizer.addEventListener('selectstart', (e) => e.preventDefault());
        resizer.addEventListener('dragstart', (e) => e.preventDefault());
    </script>
</body>
</html>
